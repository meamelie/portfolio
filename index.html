<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mea amélie</title><meta name="application-name" content="mea amélie"><meta name="apple-mobile-web-app-title" content="mea amélie"><meta property="og:title" content="mea amélie"><meta property="og:site_name" content="mea amélie"><link rel="icon" type="image/svg+xml" href="favicon.svg"><style>body{margin:0;background:#000}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600;800&family=Mrs+Saint+Delafield&family=Doto:wght@700;900&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Barlow+Condensed:wght@600&family=Barlow+Semi+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
  /* One deliberate dark look: pitch-black page, pale plaster, brushed steel, a baby-pink dot-matrix screen. */
  :root {
    --bg:#000; --glow:#000; --ink:#f1efe9; --muted:#8f8b84; --line:#f1efe9; --wall:#bdbab4; --shadow:rgba(0,0,0,.8);
    --font-display:"Cormorant Garamond", Georgia, serif;
    --font-body:"Inter", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background-color:var(--bg); background-image:radial-gradient(900px 600px at 50% 28%, var(--glow) 0%, var(--bg) 72%);
         color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5;
         display:flex; flex-direction:column; align-items:center; padding-block:0 24px;
         padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  .top { align-self:stretch; padding-block:28px 60px; padding-left:clamp(10px,4vw,36px); text-transform:lowercase; font-family:var(--font-display); font-size:1.5rem; letter-spacing:.02em; }
  @media (max-width:560px) { .frame { margin-top:calc(var(--fw) * -.2) !important; } .guide { margin-bottom:0 !important; } }
  .frame { --fw:min(100vw - 32px, 72vh * .75); margin-top:calc(var(--fw) * -.096 + 19px); position:relative; width:min(100%, calc(72vh * .75)); aspect-ratio:3/4; --tw:22%; }
  .frame.narrow { --tw:36%; }
  .phone { position:absolute; inset:0; border-radius:6px; overflow:hidden; background:transparent; }
  @media (max-width:519px) { .frame { margin-top:-26px; } }
  .cam { position:absolute; inset:0; transform-origin:0 0; transition:transform 1.1s cubic-bezier(.65,0,.25,1); will-change:transform; }
  .cam img.wall { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .cam svg { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  /* a little delete key under the screen, there only while you're dialling */
  .del { all:unset; position:absolute; left:51.2%; top:20.05%; width:10.7%; height:2.35%; box-sizing:border-box; z-index:2; cursor:pointer; display:grid; place-items:center;
         border-radius:999px; background:rgba(38,38,42,.95); color:#fbc4d8; font:600 calc(var(--fw) * .0165)/1 var(--font-body); letter-spacing:.1em; text-transform:uppercase;
         text-shadow:0 0 6px rgba(255,160,198,.7); box-shadow:inset 0 1px 2px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.35); opacity:0; pointer-events:none; transition:opacity .25s ease, transform .12s ease; }
  .del.on { opacity:1; pointer-events:auto; }
  .del:hover, .del:focus-visible { background:#fbc4d8; color:#26262a; text-shadow:none; outline:none; }
  .del:active { transform:scale(.94); }
  canvas.lcd { position:absolute; left:47.667%; top:14.05%; width:17.733%; height:5.75%; opacity:1; pointer-events:none; border-radius:2px; }
  .guide { position:relative; z-index:6; display:flex; flex-direction:column; align-items:center; margin:0 0 14px; }
  .hint { transition:opacity .3s ease; margin:0; font-size:.82rem; letter-spacing:.08em; color:var(--muted); text-align:center; min-height:1.5em; }
  /* quick menu for people in a rush: a small pill at the bottom, opens into the sections */
  .afterwrap { position:relative; }
  .quick { position:relative; z-index:60; display:flex; flex-direction:column; align-items:center; margin:clamp(14px, 3vh, 30px) auto 40px;
           transition:opacity .4s ease, transform .4s ease; }
  body.qhide .quick { opacity:0; transform:translateY(10px); pointer-events:none; }
  .qk-t { all:unset; cursor:pointer; order:2; white-space:nowrap; padding:10px 20px; border:1px solid rgba(243,182,205,.45); border-radius:999px; background:rgba(14,12,12,.78); backdrop-filter:blur(6px);
          color:#bfb6b0; font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; transition:border-color .2s ease, color .2s ease; }
  .qk-t b { font-weight:500; color:#f3b6cd; }
  .qk-t:hover, .qk-t:focus-visible, .quick.open .qk-t { border-color:#f3b6cd; color:#f1efe9; outline:none; }
  .dir a.nl::before { display:none; }
  .dir a + a::before { content:"·"; display:inline-block; margin:0 12px 0 -2px; color:#8f6f7c; font-size:.78rem; text-shadow:none; pointer-events:none; }   /* a dot between the page names */
  /* sound on / off, top right of the main page, level with the title */
  .snd { all:unset; cursor:pointer; position:absolute; z-index:30; top:var(--logo-y, 46px); right:var(--logo-x, 52px); transform:translateY(-50%); display:inline-flex; align-items:center; gap:7px;
         color:#bfb6b0; font:500 .68rem/1 var(--font-body); letter-spacing:.16em; text-transform:uppercase; transition:color .2s ease; }
  .snd:hover, .snd:focus-visible { color:#f3b6cd; outline:none; }
  .snd svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .snd .spk { fill:currentColor; stroke:none; }
  .snd .x { display:none; }
  .snd.off .w1, .snd.off .w2 { display:none; } .snd.off .x { display:inline; }
  @media (max-width:560px) { .snd span { display:none; } }
  .dir { margin:12px 0 0; font-size:.78rem; letter-spacing:.1em; color:#f3b6cd; text-align:center; text-transform:uppercase; display:flex; flex-wrap:wrap; gap:4px 12px; justify-content:center; align-items:baseline; }
  .dir a { color:inherit; text-decoration:none; display:inline-block; transition:color .4s ease, font-size .55s cubic-bezier(.34,1.6,.5,1), text-shadow .4s ease; }
  .dir a:hover, .dir a:focus-visible, .dir a.pop { color:#ffe1ec; font-size:1.06rem; text-shadow:0 0 14px rgba(255,160,198,.6); outline:none; }   /* grows, and nudges its neighbours aside */
  .guide-dot { position:fixed; z-index:999; left:0; top:0; width:13px; height:13px; margin:-6.5px 0 0 -6.5px; border-radius:50%; pointer-events:none; background:#fbc4d8;
               box-shadow:0 0 10px 3px rgba(255,160,198,.8), 0 0 26px 8px rgba(255,160,198,.35); transition:transform .62s cubic-bezier(.34,1.45,.55,1), opacity .4s ease; }
  .dir.nudge a { color:#ffd9e6; animation:nudge 1.6s ease-in-out 3; }
  @keyframes nudge { 50% { opacity:.35; } }
  @media (prefers-reduced-motion: reduce) { .dir.nudge a { animation:none; } }
  .afterwrap { margin-top:34px; min-height:42px; display:flex; align-items:center; justify-content:center; }
  .after { opacity:0; transition:opacity .35s ease; margin:0; display:flex; gap:22px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .after a { color:var(--ink); text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:10px 26px;
             font-family:var(--font-display); font-size:1.3rem; }
  .after a:hover, .after a:focus-visible { background:var(--ink); color:var(--bg); outline:none; }
  .after.in { opacity:1; }
  .after button { all:unset; cursor:pointer; color:#f3b6cd; font-size:.85rem; letter-spacing:.16em; text-transform:uppercase; text-decoration:underline; text-underline-offset:6px; text-decoration-thickness:1px; }
  .after button:hover, .after button:focus-visible { color:#ffd9e6; }
  /* the ticket: slides out of the slot, stretches down the page, then opens into it */
  .tk { position:absolute; left:calc(64% - var(--tw) / 2); top:71.6%; width:var(--tw); height:calc(var(--h, 100px) + 45vh); z-index:5;
        pointer-events:none; container-type:inline-size; clip-path:inset(0 -60px 0 -60px); }
  .tk { --paper:#fde6ee; }
  .tkp { position:relative; height:var(--h, 100px); display:flex; flex-direction:column; justify-content:flex-end;
         background:linear-gradient(0deg, #fde6ee var(--rt, 100%), var(--paper) var(--rt, 100%)); color:#2a2622; transform:translateY(-100%);
         transition:transform .42s cubic-bezier(.3,.7,.2,1); filter:drop-shadow(0 6px 10px rgba(0,0,0,.6)); overflow:visible; }
  .tkp.out { transform:translateY(0); }
  .tkp::before { content:""; position:absolute; left:3cqw; right:3cqw; bottom:3cqw; height:calc(var(--rt, 100%) - 6cqw); border:1px dashed #e29cb8; pointer-events:none; }
  .tkp::after { content:""; position:absolute; left:0; right:0; top:100%; height:4cqw; margin-top:-1px;
                background:conic-gradient(from -45deg at 50% 100%, #fde6ee 0 90deg, transparent 0) 0 0 / 8cqw 100%; }
  .tkc { position:relative; padding:15cqw 10cqw 13cqw; display:flex; flex-direction:column; gap:5cqw; text-align:center; }
  .tkc small { font-size:6.4cqw; letter-spacing:.2em; text-transform:uppercase; color:#6d4456; font-family:var(--font-body); }
  /* a proper ticket: header, perforation with punched notches, the page name, admit one, barcode and serial */
  .tkc .tkk { font-family:var(--font-body); font-weight:600; font-size:max(10px, 9.5cqw); letter-spacing:.34em; line-height:1; color:#2a2622; text-transform:uppercase; margin-right:-.34em; }
  .tkc .tkn { font-family:var(--font-display); font-style:italic; font-weight:500; font-size:max(14px, 15cqw); line-height:1; color:#5a3a48; margin-top:-1cqw; }
  .tkc .tkrule { display:block; position:relative; height:0; margin:3cqw -10cqw 2cqw; border-top:1.5px dashed #c98aa4; }
  .tkc .tkrule::before, .tkc .tkrule::after { content:""; position:absolute; top:-4.5cqw; width:9cqw; height:9cqw; border-radius:50%; background:#0b0a0a; }
  .tkc .tkrule::before { left:-4.5cqw; } .tkc .tkrule::after { right:-4.5cqw; }
  .tkc b { font-family:var(--font-body); font-weight:800; font-size:24cqw; line-height:1; letter-spacing:.02em; text-transform:uppercase; text-wrap:balance; overflow-wrap:normal; color:#1f1b18; }
  .tkc .tkadm { font-family:var(--font-body); font-weight:500; font-size:max(8px, 5.6cqw); letter-spacing:.34em; line-height:1; text-transform:uppercase; color:#8a6070; margin:-1cqw -.34em 1cqw 0; }
  .tkc .tkser { font-family:var(--font-body); font-weight:500; font-size:max(7px, 4.6cqw); letter-spacing:.3em; line-height:1; color:#8a6070; margin:-3cqw -.3em 0 0; }
  .tkc .tkd { font-family:"Barlow Condensed", "Arial Narrow", sans-serif; font-weight:600; font-size:19cqw; line-height:1; letter-spacing:.02em; white-space:nowrap; }
  .tkc .bar { height:14cqw; margin:0; background:repeating-linear-gradient(90deg,#2a2622 0 2px,transparent 2px 5px,#2a2622 5px 6px,transparent 6px 10px); opacity:.8; }
  .tkrail { display:none; }                                                  /* just a plain roll, no small print along it */
  .tk.plain .tkrail, .tk.plain .tkp::before { opacity:0; }
  .tkp::before { transition:opacity .3s ease; }
  .tkrail { position:absolute; left:0; right:0; bottom:0; top:var(--rt, 80cqw); overflow:hidden; writing-mode:vertical-rl; text-align:center; font-size:5.2cqw; letter-spacing:.3em; color:#e9a2bd; white-space:nowrap; text-transform:uppercase; line-height:2.4; }
  .letter { position:fixed; inset:0; z-index:100; overflow:auto; color:#f1efe9; background:transparent; }
  .stage { position:fixed; inset:0; background:#0b0a0a; opacity:0; transition:opacity .9s ease; pointer-events:none; }
  .letter.dark .stage { opacity:1; }
  /* the red velvet curtains the ticket turns into */
  .curtain { position:fixed; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  .letter .page { position:relative; z-index:1; max-width:700px; margin:0 auto; padding:clamp(84px,14vh,130px) 0 90px; opacity:0; transition:opacity .55s ease;
                  padding-left:max(24px, env(safe-area-inset-left, 0px)); padding-right:max(24px, env(safe-area-inset-right, 0px)); }
  .letter.ready .page { opacity:1; }
  @media (max-width:639px) { .letter .page { padding-left:max(44px, env(safe-area-inset-left, 0px)); padding-right:max(44px, env(safe-area-inset-right, 0px)); } }
  .letter .meta { font-size:.75rem; letter-spacing:.22em; text-transform:uppercase; color:#fbc4d8; margin:0 0 18px; }
  .letter h2 { font-family:var(--font-display); font-weight:400; text-transform:uppercase; letter-spacing:.02em; font-size:clamp(2rem,5.6vw,3.2rem); line-height:1.05; margin:0 0 22px; text-wrap:balance; }
  .letter .lead { color:#cfcac1; font-size:1.05rem; max-width:48ch; margin:0 0 10px; }
  .letter .soon { color:#8f8b84; font-size:.85rem; font-style:italic; }
  /* both corner buttons sit level with the 'mea amélie' title on the phone page: same height, same distance from the edge */
  .hang { all:unset; cursor:pointer; position:fixed; z-index:101; top:max(var(--logo-x, 52px), env(safe-area-inset-top, 0px)); right:var(--logo-x, 52px);
          font-size:.78rem; letter-spacing:.16em; text-transform:uppercase; color:#f1efe9; border:1px solid #f1efe9; border-radius:999px; padding:9px 18px; opacity:0; transition:opacity .5s ease; }
  .letter.ready .hang { opacity:1; }
  .hang:hover, .hang:focus-visible { background:#f1efe9; color:#0b0a0a; }
  /* a little handset in front of the words; on hover it tips down into the cradle */
  .hang { display:inline-flex; align-items:center; gap:9px; }
  .hang .hs { width:17px; height:17px; flex:0 0 auto; color:#fbc4d8; transform-origin:50% 60%; transition:transform .45s cubic-bezier(.34,1.6,.5,1), color .2s ease; }
  .hang:hover .hs, .hang:focus-visible .hs { transform:rotate(-14deg) translateY(2px); color:#7c132a; }
  @media not all and (hover:hover) and (pointer:fine) { .hang .hs { display:none; } }   /* phones keep the plain button */
  /* a glowing pink dot replaces the arrow on desktop; the hand stays on the dial */
  #cur { position:fixed; left:0; top:0; z-index:1000; width:11px; height:11px; margin:-5.5px 0 0 -5.5px; border-radius:50%; pointer-events:none; opacity:0;
         background:#fbc4d8; box-shadow:0 0 8px 2px rgba(255,160,198,.75), 0 0 20px 6px rgba(255,160,198,.3);
         transition:opacity .2s ease, width .15s ease, height .15s ease, margin .15s ease; will-change:transform; }
  #cur.inlight { opacity:0 !important; }
  #cur.idle:not(.ring):not(.hand):not(.grab) { opacity:0 !important; transition:opacity .9s ease, width .15s ease, height .15s ease, margin .15s ease; }   /* the pink dot fades away after 3s of stillness */                                      /* between the curtains the light itself is the cursor */
  #gtrail { position:fixed; inset:0; width:100%; height:100%; z-index:999; pointer-events:none; filter:blur(4px); }
  @media not all and (hover:hover) and (pointer:fine) { #gtrail { display:none; } }
  #cur.hand, #cur.ring { width:30px; height:30px; margin:-15px 0 0 -15px; background:transparent; border:1.5px solid #fbc4d8; }
  #cur.ring.down { width:22px; height:22px; margin:-11px 0 0 -11px; }
  #cur.grab { width:16px; height:16px; margin:-8px 0 0 -8px; }
  #cur.down { width:7px; height:7px; margin:-3.5px 0 0 -3.5px; }
  @media (hover:hover) and (pointer:fine) { * { cursor:none !important; } }          /* the pink dot / ring replaces the cursor everywhere, the dial included */
  @media not all and (hover:hover) and (pointer:fine) { #cur { display:none; } }
  /* works: ticket stubs, then a dark screening room */
  .works { margin-top:38px; display:flex; flex-direction:column; gap:14px; }
  .stub { all:unset; box-sizing:border-box; cursor:pointer; position:relative; display:grid; grid-template-columns:2.6rem 1fr auto; align-items:center; gap:2px 18px;
          padding:20px 22px 20px 20px; background:#fff; border-radius:4px; color:#0c0b0b;
          transition:transform .35s ease, box-shadow .35s ease, background .35s ease; }
  .stub::before, .stub::after { content:""; position:absolute; top:50%; width:18px; height:18px; margin-top:-9px; border-radius:50%; background:#0b0a0a; }
  .stub::before { left:-10px; } .stub::after { right:-10px; }
  .stub:hover, .stub:focus-visible { transform:translateX(6px); box-shadow:0 0 34px rgba(255,160,198,.45); }
  /* the spotlight: the stage between the curtains is dimmed, the cursor is the light. it sits under the curtains, so they stay as they are.
     the dark is the shadow of one soft-edged hole, which is a circle round the cursor, or stretches to wrap the ticket you're on */
  .spot { position:fixed; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; opacity:0; transition:opacity .8s ease; }
  .letter.ready.lit .spot { opacity:1; }
  .letter.lit .stub:hover { box-shadow:0 0 44px rgba(255,214,190,.28); }
  @media not all and (hover:hover) and (pointer:fine) { .spot { display:none; } }
  .stub .no { grid-row:1 / span 2; font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:600; font-size:1.5rem; color:#0c0b0b; }
  .stub .ti { grid-column:2; font-family:var(--font-display); font-style:italic; font-size:clamp(1.2rem,3.4vw,1.65rem); line-height:1.1; }
  .stub .mt { grid-column:2; font-size:.7rem; letter-spacing:.18em; text-transform:uppercase; color:#7c132a; }
  .stub .tm { grid-column:3; grid-row:1 / span 2; padding-left:18px; border-left:1px dashed #ff9dc2; font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:600; font-size:1.25rem; letter-spacing:.04em; }
  /* the screening room has no box of its own: the house lights go down and the film appears in the dark */
  .room { position:fixed; inset:0; z-index:100; overflow:auto; background:rgba(11,10,10,0); color:#f1efe9; transition:background .6s ease; }
  .room.lit, .room.ready { background:#0b0a0a; }
  /* a soft dark band at the top, so text scrolls away under the buttons instead of behind them */
  .room::after { content:""; position:fixed; left:0; right:0; top:0; height:calc(var(--logo-x, 52px) * 2 + 40px); z-index:4; pointer-events:none;
                 background:linear-gradient(180deg, #0b0a0a 55%, rgba(11,10,10,0)); opacity:0; transition:opacity .4s ease; }
  .room.ready.scrolled::after { opacity:1; }
  .room.theater::after { opacity:0; }
  .room .rm { position:relative; max-width:980px; margin:0 auto; padding:clamp(84px,12vh,120px) 0 100px;
              padding-left:max(20px, env(safe-area-inset-left, 0px)); padding-right:max(20px, env(safe-area-inset-right, 0px)); }
  .room:not(.ready) .rm > :not(.player) { opacity:0; }
  .room .player { opacity:0; }
  .room.lit .player { animation:projOn 1s linear forwards; }
  .room.off .player { animation:projOff .42s linear forwards; }
  @keyframes projOn  { 0% { opacity:0; filter:brightness(2.4); } 9% { opacity:.75; } 15% { opacity:.06; } 27% { opacity:.9; } 33% { opacity:.22; }
                       48% { opacity:1; filter:brightness(1.7); } 100% { opacity:1; filter:none; } }
  @keyframes projOff { 0% { opacity:1; } 25% { opacity:.3; } 35% { opacity:.8; } 100% { opacity:0; filter:brightness(1.8); } }
  /* the projector beam: a faint cone of warm light from above, flickering on with the film */
  .beam { position:fixed; inset:0; pointer-events:none; opacity:0; background:radial-gradient(ellipse 22% 95% at 50% -25%, rgba(255,234,214,.11), rgba(255,234,214,.035) 50%, transparent 78%); }
  .room.lit .beam { animation:projOn 1s linear forwards, beamOut 1.6s ease .9s forwards; }
  @keyframes beamOut { to { opacity:0; } }
  .room.off .beam { animation:projOff .42s linear forwards; }
  /* house lights down: the page fades, the spotlight goes out, the curtains fade away until it's completely dark */
  .letter .curtain { transition:opacity 1s ease; }
  .letter.inroom .curtain { opacity:0; }
  .letter.ready.inroom .page { opacity:0; transition:opacity .7s ease; pointer-events:none; }
  .letter.ready.lit.inroom .spot { opacity:0; }
  .room:not(.ready) .back { opacity:0; pointer-events:none; }
  .tearclone { pointer-events:none; }
  /* ---------- cv (101): the phone faxes it out of the slot, it lifts up to read, and you tear it off to download ---------- */
  .fax { position:absolute; left:calc(64% - var(--tw) * .6); top:71.6%; width:calc(var(--tw) * 1.2); height:0; z-index:5; overflow:hidden; pointer-events:none;
         box-shadow:0 8px 14px rgba(0,0,0,.55); background:#fbfaf6; }
  .fax img { display:block; width:100%; height:auto; filter:grayscale(.15) contrast(.96) sepia(.08); }
  .fax::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(0,0,0,.14), transparent 12%, transparent 88%, rgba(0,0,0,.14)); }   /* the paper curls a little */
  .letter.fmode .page, .letter.fmode .spot, .letter.fmode .curtain { display:none; }
  .ffly { position:fixed; z-index:4; pointer-events:none; box-shadow:0 30px 70px rgba(0,0,0,.6); transition:left .75s cubic-bezier(.6,0,.2,1), top .75s cubic-bezier(.6,0,.2,1), width .75s cubic-bezier(.6,0,.2,1); }
  .fview { position:fixed; inset:0; z-index:3; overflow:auto; opacity:0; transition:opacity .4s ease; }
  .fview.on { opacity:1; }
  .fv-in { width:min(720px, 92vw); margin:96px auto 70px; }
  .fpaper { position:relative; transform-origin:50% 0; box-shadow:0 30px 70px rgba(0,0,0,.6); }
  .fpaper img { display:block; width:100%; height:auto; }

  const WORKS = [
    { title:"Balta Vasara (White Summer)", place:'Lithuania', kind:'Reel', year:'2026', role:'Director | Editor', runtime:'00:29', durations:['00:18', '00:11'],
      stills:[], desc:"Balta Vasara is a music event that wants to bring Lithuanian music back. In Lithuania people listen to artists from abroad more and more, and local music is slowly getting pushed aside. The event has been happening in summer for a few years, and in 2026 the organizers did an autumn edition for the first time. I made two campaign reels to get people excited about it.\n\nThe dress code is white, so white is in everything. In part 1, a girl gets ready and heads to the event. I kept the music fast and the cuts quick to show how fun and glam the night would be, and we also fit in a Red Bull ad. Part 2 starts with the girls' heels and slowly shows more of them as they dance and lip-sync. It's slower and more melodic. I picked the song on purpose: the title and chorus mean “I don't want to wait anymore”, which is exactly the mood before a night like this.", credits:[["Director / Editor", "Mija Amelija Griniūtė"], ["Videographer", "Ieva Avižonytė"], ["Producers", "Simonas Vogulis & Rojus Malinauskas"], ["Cast", "Adrija Jurkevičiūtė, Medėja Malinauskaitė, Rugilė Milašiūtė"]], music:["SEL – Mano Naktys", "Džordana Butkutė – Nebenoriu laukt"],

    { title:'Venice Fashion Show', place:'Italy', kind:'Reel', year:'2026', role:'Creator | Videographer | Editor', runtime:'01:14',
      stills:[], desc:"This was my first fashion show. I was living in Venice at the time, and I wanted to film the whole evening, from getting ready to arriving to the show itself.\n\nIn the voiceover I talk about something I've struggled with for a long time: dressing in a way that makes sense to other people, not to me, until your style gets kind of boring. That night I dressed up a bit more than usual, and the show reminded me that there's no right or wrong in fashion. It's personal. You get to tell your own story, just like the designers did with their collections.", credits:[], music:["Fyodor feat. Apéro – Let Me Grow"],
      vimeo:'https://vimeo.com/1246430716' },

      stills:[], desc:"I made this at a film camp where we worked in teams, each with our own role. The theme that year was experimental cinema, so we had lectures on it and then made our own film. It was my first time editing, and honestly it was a challenge.\n\nThe film is about how lonely it can feel to grow up and fight your own monster. In our team we talked about our insecurities and decided to focus on the body. A girl is chased through the woods by a monster, which is really her own fear. In between, we see other people and what they struggle with: feeling too skinny, clothes that don't fit, not finding their style, acne. In the end she jumps into the water and someone pulls her deeper. The film cuts there, so what happens next is up to you. The song is about leaving and running into yourself again and again, and it fits the feeling of the whole film.", credits:[["Director", "Eimantė Ališauskaitė"], ["Cinematographer", "Jogaila Mitkus"], ["Producer", "Kamilė Buteliauskaitė"], ["Editor", "Mija Amelija Griniūtė"], ["Sound design", "Ugnė Dominaitė"], ["Cast", "Rapolas Misevičius, Vaiva Evaltaitė"]], music:["Kyla Vėjas! – Išeinu"], copyright:"© Youngblood Film School",

  const hx = n => RING * Math.cos(rad(holeAngle(n))), hy = n => RING * Math.sin(rad(holeAngle(n)));
  const digitsList = [1,2,3,4,5,6,7,8,9,0];

  const wheel = document.getElementById('wheel'), hit = document.getElementById('hit');

    const key = digits.join(''); current = DIRECTORY[key] ? Object.assign({ num:key }, DIRECTORY[key]) : null;

    else {
      wrongs++;
      let k; do { k = Math.floor(Math.random() * WRONG.length); } while (k === lastWrong && WRONG.length > 1);
      lastWrong = k; wrongMsg = WRONG[k];
      if (wrongs >= 2) dirEl.classList.add('nudge');
    }
    phase = 'busy'; setHint('calling…  (tap to skip)'); document.body.classList.add('qhide'); updateDel();
    await wait(500); if (!alive()) return;
    for (let i = 0; i < FLASHES; i++) {
      lcdShow([CALLING]); ringTone(); await wait(650); if (!alive()) return;
      lcdHide(); await wait(380); if (!alive()) return;
    }
    pickUp();
    if (current) {                                   // a number from the directory: show who you're calling
      lcdShow([current.label]); live.textContent = 'Connected: ' + current.title; await wait(650); if (!alive()) return;
    } else {                                         // any other number: Mea picks up, says hello (her voice, with the words on screen), then the message
      sayHello(); lcdShow([ANSWER1]); live.textContent = ANSWER1;
      await wait(1400); if (!alive()) { try { voice.pause(); } catch (e) {} return; }
      lcdShow(ANSWER2); live.textContent = ANSWER1 + ', ' + ANSWER2.join(' ');
      await wait(1450); if (!alive()) { try { voice.pause(); } catch (e) {} return; }
      for (let i = 0; i < wrongMsg.length; i++) {
        lcdShow(wrongMsg[i]); if (i === 0) live.textContent = wrongMsg.map(f => f.join(' ')).join(' ').toLowerCase();
        if (i === wrongMsg.length - 1) chime();
        await wait(i === wrongMsg.length - 1 ? 2200 : 2400); if (!alive()) return;
      }
    }
    finishNow();
  }
  // made a mistake? delete the last digit (the little key under the screen, or Backspace); Escape clears them all
  const delBtn = document.getElementById('del');
  function updateDel() { delBtn.classList.toggle('on', phase === 'dial' && digits.length > 0 && digits.length < DIGITS_TO_DIAL); }
  function deleteDigit(all) {
    if (phase !== 'dial' || !digits.length || drag || returning) return;
    runId++; if (all) digits = []; else digits.pop(); blip(640, .07, .04, 'sine');
    digits.length ? lcdShow([digitLine()], 90) : lcdHide(); updateDel();
  }
  delBtn.addEventListener('click', e => { e.stopPropagation(); deleteDigit(false); });
  window.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    if (e.key === 'Backspace' && phase === 'dial' && digits.length) { e.preventDefault(); deleteDigit(false); }
    else if (e.key === 'Escape' && phase === 'dial' && digits.length) deleteDigit(true);
  });
  function onDigit(n) {
    if (phase === 'lang') { pickLang(n); return; }
    if (phase !== 'dial') return;
    runId++; digits.push(n); keyBeep(); lcdShow([digitLine()], 90); updateDel();
    if (digits.length >= DIGITS_TO_DIAL) { callSequence(); return; }
  }

  /* ---------- on arrival: Mea picks up ---------- */
  (async function greet() {
    const id = runId, alive = () => id === runId && phase === 'dial' && !digits.length;
    await wait(900); if (!alive()) return;
    lcdShow([ANSWER1]); live.textContent = ANSWER1; await wait(1900); if (!alive()) return;
    lcdShow(ANSWER2); live.textContent = ANSWER1 + ', ' + ANSWER2.join(' '); await wait(3200); if (!alive()) return;
    lcdHide();
  })();

  /* ---------- dragging the wheel ---------- */
  let rot = 0, drag = null, returning = null;      // rot = degrees turned clockwise
  function toArt(e) {
    const r = svg.getBoundingClientRect();
    return { x:(e.clientX - r.left) * 1500 / r.width, y:(e.clientY - r.top) * 2000 / r.height };
  }
  const angleAt = p => Math.atan2(-(p.y - CY), p.x - CX) * 180 / Math.PI;
  // the cursor ring snaps onto the finger hole you're on, and stays on it as the wheel turns
  let hoverHole = null;
  hit.addEventListener('pointerleave', () => { if (!drag) hoverHole = null; });
  window.__magnet = () => {
    const n = drag ? drag.n : hoverHole; if (n === null || n === undefined) return null;
    const r = svg.getBoundingClientRect(), k = r.width / 1500, a = rad(holeAngle(n) - (drag ? rot : 0));
    return { x:r.left + (CX + RING * Math.cos(a)) * k, y:r.top + (CY - RING * Math.sin(a)) * k, r:HOLE_R * k };
  };
  function pickHole(p) {
    let best = null, bd = 1e9;
    digitsList.forEach(n => { const d = Math.hypot(p.x - (CX + hx(n)), p.y - (CY - hy(n))); if (d < HOLE_R * 1.5 && d < bd) { bd = d; best = n; } });
    return best;
  }
  hit.addEventListener('pointerdown', e => {
    if (phase === 'busy') { runId++; finishNow(); return; }       // tap during the call = skip to the end
    if (returning || (phase !== 'dial' && phase !== 'lang')) return;
    const p = toArt(e), n = pickHole(p); if (n === null) return;
    e.preventDefault();
    try { hit.setPointerCapture(e.pointerId); } catch (err) {}
    hit.style.cursor = 'grabbing';
    drag = { n, last:angleAt(p), max:maxRot(n) }; tick();
  });
  hit.addEventListener('pointermove', e => {
    const p = toArt(e);
    if (!drag) { hoverHole = (!returning && (phase === 'dial' || phase === 'lang')) ? pickHole(p) : null; hit.style.cursor = hoverHole !== null ? 'grab' : 'none'; return; }
    const a = angleAt(p); let d = drag.last - a;
    if (d > 180) d -= 360; if (d < -180) d += 360;
    const before = Math.floor(rot / 30);
    rot = Math.max(0, Math.min(drag.max, rot + d));
    if (Math.floor(rot / 30) !== before) tick();
    drag.last = a;
  });
  function release() { if (!drag) return; hoverHole = null; hit.style.cursor = 'none'; returning = { n:drag.n, ok:rot >= drag.max - 5 }; drag = null; }
  hit.addEventListener('pointerup', release); hit.addEventListener('pointercancel', release);
  // let go anywhere counts: outside the dial, outside the window, switching tabs, or if the browser drops the drag
  hit.addEventListener('lostpointercapture', release);
  window.addEventListener('pointerup', release); window.addEventListener('pointercancel', release);
  window.addEventListener('blur', release); document.addEventListener('visibilitychange', () => { if (document.hidden) release(); });
  window.addEventListener('pointermove', e => { if (drag && e.pointerType === 'mouse' && e.buttons === 0) release(); }, { passive:true });
  window.addEventListener('keydown', e => {
    if (!/^[0-9]$/.test(e.key) || drag || returning || (phase !== 'dial' && phase !== 'lang')) return;
    const n = +e.key; rot = maxRot(n); returning = { n, ok:true }; tick();
  });

  /* test hook: where things are on screen */
  window.__ph = {
    busy: () => !!returning, count: () => digits.length, phase: () => phase, isOpen: () => letterOpen, hangUp: () => hangUp(), lines: () => lastLines.join(' / '),
    hole(n) { const r = svg.getBoundingClientRect(), s = r.width / 1500; return [r.left + (CX + hx(n)) * s, r.top + (CY - hy(n)) * s, holeAngle(n), maxRot(n)]; },
    center() { const r = svg.getBoundingClientRect(), s = r.width / 1500; return [r.left + CX * s, r.top + CY * s]; },
    ringPx() { return svg.getBoundingClientRect().width / 1500 * RING; }
  };

  /* ---------- the pink dot cursor ---------- */
  (function () {
    if (!window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
    const cur = document.getElementById('cur'); let x = -50, y = -50, tx = -50, ty = -50, seen = false, onHand = false;
    // over an embedded video the page can't see the mouse at all, so the dot steps aside there (vimeo's own cursor works its controls),
    // and comes back exactly under the mouse when it leaves, instead of sliding over from where it froze
    let away = false;
    const goAway = () => { away = true; cur.style.opacity = 0; };
    document.addEventListener('pointerover', e => { if (e.target && e.target.tagName === 'IFRAME') goAway(); }, true);
    window.addEventListener('blur', goAway);
    window.addEventListener('pointermove', e => {
      if (e.pointerType === 'touch') return;
      if (e.target && e.target.tagName === 'IFRAME') { goAway(); return; }
      tx = e.clientX; ty = e.clientY; if (!seen || away) { x = tx; y = ty; seen = true; away = false; }
      onHand = e.target === hit && /grab/.test(hit.style.cursor);                // over a finger hole: an empty ring instead of a hand
      cur.classList.toggle('ring', onHand); cur.style.opacity = 1;
    }, { passive:true });
    document.addEventListener('pointerleave', () => { cur.style.opacity = 0; });
    document.documentElement.addEventListener('mouseleave', () => { cur.style.opacity = 0; });
    let idleT = 0; const wake = () => { cur.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => cur.classList.add('idle'), 3000); };
    ['pointermove', 'pointerdown', 'wheel'].forEach(ev => window.addEventListener(ev, wake, { passive:true })); wake();
    window.addEventListener('pointerdown', () => cur.classList.add('down'));
    window.addEventListener('pointerup', () => cur.classList.remove('down'));
    // the pink dot leaves a soft trace wherever it's on show (the Works stage has its spotlight instead, and the passes page has its own trace behind the cards)
    const gt = document.getElementById('gtrail'), gx2 = gt.getContext('2d'); let gpts = [], glx = null, gly = null;
    const traceOn = () => {
      if (cur.classList.contains('inlight') || cur.classList.contains('ring') || cur.style.opacity === '0' || (window.__magnet && window.__magnet())) return false;
      if (overPhone) return false;                                              // never over the payphone itself
      const L = document.getElementById('letter');
      if (L && !L.hidden) { if (L.classList.contains('passmode')) return false;
        const modes = ['sheetmode', 'dispmode', 'cmode', 'fmode', 'inroom']; if (!modes.some(m => L.classList.contains(m))) return false; }   // the curtains page
      return true;
    };
    let overPhone = false;
    // the trace stops exactly at the payphone's edge: the cut-out's own outline is used as a mask
    const pmask = { ok:false, w:300, h:400, a:null };
    (function () { const im = new Image(); im.onload = () => { try { const c = document.createElement('canvas'); c.width = pmask.w; c.height = pmask.h;
        const x = c.getContext('2d'); x.drawImage(im, 0, 0, pmask.w, pmask.h); pmask.a = x.getImageData(0, 0, pmask.w, pmask.h).data; pmask.ok = true; } catch (err) {} };
      im.src = 'images/phone.png'; })();
    function onPhoneArt(cx, cy) {
      const sv = document.getElementById('ui'); if (!sv) return false; const r = sv.getBoundingClientRect();
      if (cx < r.left || cx > r.right || cy < r.top || cy > r.bottom) return false;
      const fr = document.getElementById('phone').getBoundingClientRect(); if (cx < fr.left || cx > fr.right || cy < fr.top || cy > fr.bottom) return false;
      if (!pmask.ok) return true;                                               // mask not ready yet: play it safe
      const ax = Math.floor((cx - r.left) / r.width * pmask.w), ay = Math.floor((cy - r.top) / r.height * pmask.h);
      return pmask.a[(ay * pmask.w + ax) * 4 + 3] > 40;
    }
    window.addEventListener('pointermove', e => {
      overPhone = !!(e.target && e.target.closest && e.target.closest('#tk, .fax')) || onPhoneArt(e.clientX, e.clientY);
      if (e.pointerType !== 'mouse' || !traceOn()) { glx = null; return; }
      const now = performance.now();
      if (glx !== null) { const d = Math.hypot(e.clientX - glx, e.clientY - gly), n = Math.min(24, Math.ceil(d / 6)); for (let k = 1; k <= n; k++) gpts.push({ x:glx + (e.clientX - glx) * k / n, y:gly + (e.clientY - gly) * k / n, t:now }); }
      glx = e.clientX; gly = e.clientY;
    }, { passive:true });
    (function gloop() {
      const dpr = Math.min(2, devicePixelRatio || 1), W = innerWidth, H = innerHeight, now = performance.now();
      if (gt.width !== Math.round(W * dpr) || gt.height !== Math.round(H * dpr)) { gt.width = Math.round(W * dpr); gt.height = Math.round(H * dpr); }
      gpts = gpts.filter(p => now - p.t < 800);
      gx2.setTransform(dpr, 0, 0, dpr, 0, 0); gx2.clearRect(0, 0, W, H);
      if (gpts.length) { gx2.globalCompositeOperation = 'lighter';
        gpts.forEach(p => { const k = 1 - (now - p.t) / 800, r = 2.5 + 7 * k; gx2.fillStyle = `rgba(251,150,190,${(.14 * k * k).toFixed(3)})`; gx2.beginPath(); gx2.arc(p.x, p.y, r, 0, 7); gx2.fill(); });
        gx2.globalCompositeOperation = 'source-over'; }
      requestAnimationFrame(gloop);
    })();
    let snapped = false;
    (function move() {
      const m = window.__magnet && window.__magnet();
      if (m) { const d = Math.round(m.r * 2 + 6); cur.style.width = cur.style.height = d + 'px'; cur.style.margin = (-d / 2) + 'px 0 0 ' + (-d / 2) + 'px'; cur.classList.add('ring'); cur.style.opacity = 1; snapped = true; }
      else if (snapped) { cur.style.width = cur.style.height = cur.style.margin = ''; cur.classList.remove('ring'); snapped = false; }
      const gx = m ? m.x : tx, gy = m ? m.y : ty;
      const k = reduce ? 1 : (m ? .45 : .35); x += (gx - x) * k; y += (gy - y) * k;
      cur.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
      requestAnimationFrame(move);
    })();
  })();

  /* ---------- loop ---------- */
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.5, (now - last) / 1000); last = now;
    if (returning) {
      const before = Math.floor(rot / 30);
      rot -= 300 * dt;
      if (Math.floor(rot / 30) !== before) tick();
      if (rot <= 0) { rot = 0; const r = returning; returning = null; if (r.ok) onDigit(r.n); }
    }
    wheel.setAttribute('transform', `rotate(${rot.toFixed(2)} ${CX} ${CY})`);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body></html>
