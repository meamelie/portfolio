<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#000}</style></head><body><title>Cou Cou Payphone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600;800&family=Barlow+Condensed:wght@600&family=Barlow+Semi+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
  /* One deliberate dark look: pitch-black page, pale plaster, brushed steel, a baby-pink dot-matrix screen. */
  :root {
    --bg:#000; --glow:#000; --ink:#f1efe9; --muted:#8f8b84; --line:#f1efe9; --wall:#bdbab4; --shadow:rgba(0,0,0,.8);
    --font-display:"Cormorant Garamond", Georgia, serif;
    --font-body:"Inter", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { background-color:var(--bg); background-image:radial-gradient(900px 600px at 50% 28%, var(--glow) 0%, var(--bg) 72%);
         color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5;
         display:flex; flex-direction:column; align-items:center; padding-block:0 24px;
         padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  .top { align-self:stretch; padding-block:28px 60px; padding-left:clamp(10px,4vw,36px); text-transform:lowercase; font-family:var(--font-display); font-size:1.5rem; letter-spacing:.02em; }
  .frame { --fw:min(100vw - 32px, 72vh * .75); margin-top:calc(var(--fw) * -.096 + 19px); position:relative; width:min(100%, calc(72vh * .75)); aspect-ratio:3/4; --tw:22%; }
  .frame.narrow { --tw:36%; }
  .phone { position:absolute; inset:0; border-radius:6px; overflow:hidden; background:transparent; }
  @media (max-width:519px) { .frame { margin-top:-26px; } }
  .cam { position:absolute; inset:0; transform-origin:0 0; transition:transform 1.1s cubic-bezier(.65,0,.25,1); will-change:transform; }
  .cam img.wall { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .cam svg { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  canvas.lcd { position:absolute; left:47.667%; top:14.05%; width:17.733%; height:5.75%; opacity:1; pointer-events:none; border-radius:2px; }
  .guide { position:relative; z-index:6; display:flex; flex-direction:column; align-items:center; margin:0 0 14px; }
  .hint { transition:opacity .3s ease; margin:0; font-size:.82rem; letter-spacing:.08em; color:var(--muted); text-align:center; min-height:1.5em; }
  .dir { margin:12px 0 0; font-size:.78rem; letter-spacing:.1em; color:#f3b6cd; text-align:center; text-transform:uppercase; display:flex; flex-wrap:wrap; gap:4px 14px; justify-content:center; }
  .dir span { transition:color .6s ease; }
  .dir.nudge span { color:#ffd9e6; animation:nudge 1.6s ease-in-out 3; }
  @keyframes nudge { 50% { opacity:.35; } }
  @media (prefers-reduced-motion: reduce) { .dir.nudge span { animation:none; } }
  .afterwrap { margin-top:34px; min-height:42px; display:flex; align-items:center; justify-content:center; }
  .after { opacity:0; transition:opacity .35s ease; margin:0; display:flex; gap:22px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .after a { color:var(--ink); text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:10px 26px;
             font-family:var(--font-display); font-size:1.3rem; }
  .after a:hover, .after a:focus-visible { background:var(--ink); color:var(--bg); outline:none; }
  .after.in { opacity:1; }
  .after button { all:unset; cursor:pointer; color:#f3b6cd; font-size:.85rem; letter-spacing:.16em; text-transform:uppercase; text-decoration:underline; text-underline-offset:6px; text-decoration-thickness:1px; }
  .after button:hover, .after button:focus-visible { color:#ffd9e6; }
  /* the ticket: slides out of the slot, stretches down the page, then opens into it */
  .tk { position:absolute; left:calc(64% - var(--tw) / 2); top:71.6%; width:var(--tw); height:calc(var(--h, 100px) + 45vh); z-index:5;
        pointer-events:none; container-type:inline-size; clip-path:inset(0 -60px 0 -60px); }
  .tk { --paper:#fde6ee; }
  .tkp { position:relative; height:var(--h, 100px); background:var(--paper); color:#2a2622; transform:translateY(-100%);
         transition:transform .42s cubic-bezier(.3,.7,.2,1); filter:drop-shadow(0 6px 10px rgba(0,0,0,.6)); overflow:visible; }
  .tkp.out { transform:translateY(0); }
  .tkp::before { content:""; position:absolute; inset:3cqw; border:1px dashed #e29cb8; pointer-events:none; }
  .tkp::after { content:""; position:absolute; left:0; right:0; top:100%; height:4cqw; margin-top:-1px;
                background:conic-gradient(from -45deg at 50% 100%, var(--paper) 0 90deg, transparent 0) 0 0 / 8cqw 100%; }
  .tkc { position:relative; padding:15cqw 10cqw 13cqw; display:flex; flex-direction:column; gap:5cqw; text-align:center; }
  .tkc small { font-size:6.4cqw; letter-spacing:.2em; text-transform:uppercase; color:#6d4456; font-family:var(--font-body); }
  /* a proper ticket: header, perforation with punched notches, the page name, admit one, barcode and serial */
  .tkc .tkk { font-family:var(--font-body); font-weight:600; font-size:max(10px, 9.5cqw); letter-spacing:.34em; line-height:1; color:#2a2622; text-transform:uppercase; margin-right:-.34em; }
  .tkc .tkn { font-family:var(--font-display); font-style:italic; font-weight:500; font-size:max(14px, 15cqw); line-height:1; color:#5a3a48; margin-top:-1cqw; }
  .tkc .tkrule { display:block; position:relative; height:0; margin:3cqw -10cqw 2cqw; border-top:1.5px dashed #c98aa4; }
  .tkc .tkrule::before, .tkc .tkrule::after { content:""; position:absolute; top:-4.5cqw; width:9cqw; height:9cqw; border-radius:50%; background:#0b0a0a; }
  .tkc .tkrule::before { left:-4.5cqw; } .tkc .tkrule::after { right:-4.5cqw; }
  .tkc b { font-family:var(--font-body); font-weight:800; font-size:24cqw; line-height:1; letter-spacing:.02em; text-transform:uppercase; text-wrap:balance; overflow-wrap:normal; color:#1f1b18; }
  .tkc .tkadm { font-family:var(--font-body); font-weight:500; font-size:max(8px, 5.6cqw); letter-spacing:.34em; line-height:1; text-transform:uppercase; color:#8a6070; margin:-1cqw -.34em 1cqw 0; }
  .tkc .tkser { font-family:var(--font-body); font-weight:500; font-size:max(7px, 4.6cqw); letter-spacing:.3em; line-height:1; color:#8a6070; margin:-3cqw -.3em 0 0; }
  .tkc .tkd { font-family:"Barlow Condensed", "Arial Narrow", sans-serif; font-weight:600; font-size:19cqw; line-height:1; letter-spacing:.02em; white-space:nowrap; }
  .tkc .bar { height:14cqw; margin:0; background:repeating-linear-gradient(90deg,#2a2622 0 2px,transparent 2px 5px,#2a2622 5px 6px,transparent 6px 10px); opacity:.8; }
  .tkrail { position:absolute; left:0; right:0; bottom:0; top:var(--rt, 80cqw); overflow:hidden; writing-mode:vertical-rl; text-align:center; font-size:5.2cqw; letter-spacing:.3em; color:#e9a2bd; white-space:nowrap; text-transform:uppercase; line-height:2.4; }
  .letter { position:fixed; inset:0; z-index:100; overflow:auto; color:#f1efe9; background:transparent; }
  .stage { position:fixed; inset:0; background:#0b0a0a; opacity:0; transition:opacity .9s ease; pointer-events:none; }
  .letter.dark .stage { opacity:1; }
  /* the red velvet curtains the ticket turns into */
  .curtain { position:fixed; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  .letter .page { position:relative; z-index:1; max-width:700px; margin:0 auto; padding:clamp(84px,14vh,130px) 0 90px; opacity:0; transition:opacity .55s ease;
                  padding-left:max(24px, env(safe-area-inset-left, 0px)); padding-right:max(24px, env(safe-area-inset-right, 0px)); }
  .letter.ready .page { opacity:1; }
  @media (max-width:639px) { .letter .page { padding-left:max(44px, env(safe-area-inset-left, 0px)); padding-right:max(44px, env(safe-area-inset-right, 0px)); } }
  .letter .meta { font-size:.75rem; letter-spacing:.22em; text-transform:uppercase; color:#fbc4d8; margin:0 0 18px; }
  .letter h2 { font-family:var(--font-display); font-weight:400; text-transform:uppercase; letter-spacing:.02em; font-size:clamp(2rem,5.6vw,3.2rem); line-height:1.05; margin:0 0 22px; text-wrap:balance; }
  .letter .lead { color:#cfcac1; font-size:1.05rem; max-width:48ch; margin:0 0 10px; }
  .letter .soon { color:#8f8b84; font-size:.85rem; font-style:italic; }
  .hang { all:unset; cursor:pointer; position:fixed; z-index:101; top:max(18px, env(safe-area-inset-top, 0px)); right:max(18px, env(safe-area-inset-right, 0px));
          font-size:.78rem; letter-spacing:.16em; text-transform:uppercase; color:#f1efe9; border:1px solid #f1efe9; border-radius:999px; padding:9px 18px; opacity:0; transition:opacity .5s ease; }
  .letter.ready .hang { opacity:1; }
  .hang:hover, .hang:focus-visible { background:#f1efe9; color:#0b0a0a; }
  /* a glowing pink dot replaces the arrow on desktop; the hand stays on the dial */
  #cur { position:fixed; left:0; top:0; z-index:1000; width:11px; height:11px; margin:-5.5px 0 0 -5.5px; border-radius:50%; pointer-events:none; opacity:0;
         background:#fbc4d8; box-shadow:0 0 8px 2px rgba(255,160,198,.75), 0 0 20px 6px rgba(255,160,198,.3);
         transition:opacity .2s ease, width .15s ease, height .15s ease, margin .15s ease; will-change:transform; }
  #cur.inlight { opacity:0 !important; }                                      /* between the curtains the light itself is the cursor */
  #cur.hand, #cur.ring { width:30px; height:30px; margin:-15px 0 0 -15px; background:transparent; border:1.5px solid #fbc4d8; }
  #cur.ring.down { width:22px; height:22px; margin:-11px 0 0 -11px; }
  #cur.grab { width:16px; height:16px; margin:-8px 0 0 -8px; }
  #cur.down { width:7px; height:7px; margin:-3.5px 0 0 -3.5px; }
  @media (hover:hover) and (pointer:fine) { * { cursor:none !important; } }          /* the pink dot / ring replaces the cursor everywhere, the dial included */
  @media not all and (hover:hover) and (pointer:fine) { #cur { display:none; } }
  /* works: ticket stubs, then a dark screening room */
  .works { margin-top:38px; display:flex; flex-direction:column; gap:14px; }
  .stub { all:unset; box-sizing:border-box; cursor:pointer; position:relative; display:grid; grid-template-columns:2.6rem 1fr auto; align-items:center; gap:2px 18px;
          padding:20px 22px 20px 20px; background:#fff; border-radius:4px; color:#0c0b0b;
          transition:transform .35s ease, box-shadow .35s ease, background .35s ease; }
  .stub::before, .stub::after { content:""; position:absolute; top:50%; width:18px; height:18px; margin-top:-9px; border-radius:50%; background:#0b0a0a; }
  .stub::before { left:-10px; } .stub::after { right:-10px; }
  .stub:hover, .stub:focus-visible { transform:translateX(6px); box-shadow:0 0 34px rgba(255,160,198,.45); }
  /* the spotlight: the stage between the curtains is dimmed, the cursor is the light. it sits under the curtains, so they stay as they are.
     the dark is the shadow of one soft-edged hole, which is a circle round the cursor, or stretches to wrap the ticket you're on */
  .spot { position:fixed; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; opacity:0; transition:opacity .8s ease; }
  .letter.ready.lit .spot { opacity:1; }
  .letter.lit .stub:hover { box-shadow:0 0 44px rgba(255,214,190,.28); }
  @media not all and (hover:hover) and (pointer:fine) { .spot { display:none; } }
  .stub .no { grid-row:1 / span 2; font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:600; font-size:1.5rem; color:#0c0b0b; }
  .stub .ti { grid-column:2; font-family:var(--font-display); font-style:italic; font-size:clamp(1.2rem,3.4vw,1.65rem); line-height:1.1; }
  .stub .mt { grid-column:2; font-size:.7rem; letter-spacing:.18em; text-transform:uppercase; color:#7c132a; }
  .stub .tm { grid-column:3; grid-row:1 / span 2; padding-left:18px; border-left:1px dashed #ff9dc2; font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:600; font-size:1.25rem; letter-spacing:.04em; }
  /* the screening room has no box of its own: the house lights go down and the film appears in the dark */
  .room { position:fixed; inset:0; z-index:100; overflow:auto; background:rgba(11,10,10,0); color:#f1efe9; transition:background .6s ease; }
  .room.lit, .room.ready { background:#0b0a0a; }
  .room .rm { position:relative; max-width:980px; margin:0 auto; padding:clamp(84px,12vh,120px) 0 100px;
              padding-left:max(20px, env(safe-area-inset-left, 0px)); padding-right:max(20px, env(safe-area-inset-right, 0px)); }
  .room:not(.ready) .rm > :not(.player) { opacity:0; }
  .room .player { opacity:0; }
  .room.lit .player { animation:projOn 1s linear forwards; }
  .room.off .player { animation:projOff .42s linear forwards; }
  @keyframes projOn  { 0% { opacity:0; filter:brightness(2.4); } 9% { opacity:.75; } 15% { opacity:.06; } 27% { opacity:.9; } 33% { opacity:.22; }
                       48% { opacity:1; filter:brightness(1.7); } 100% { opacity:1; filter:none; } }
  @keyframes projOff { 0% { opacity:1; } 25% { opacity:.3; } 35% { opacity:.8; } 100% { opacity:0; filter:brightness(1.8); } }
  /* the projector beam: a faint cone of warm light from above, flickering on with the film */
  .beam { position:fixed; inset:0; pointer-events:none; opacity:0; background:radial-gradient(ellipse 22% 95% at 50% -25%, rgba(255,234,214,.11), rgba(255,234,214,.035) 50%, transparent 78%); }
  .room.lit .beam { animation:projOn 1s linear forwards, beamOut 1.6s ease .9s forwards; }
  @keyframes beamOut { to { opacity:0; } }
  .room.off .beam { animation:projOff .42s linear forwards; }
  /* house lights down: the page fades, the spotlight goes out, the curtains fade away until it's completely dark */
  .letter .curtain { transition:opacity 1s ease; }
  .letter.inroom .curtain { opacity:0; }
  .letter.ready.inroom .page { opacity:0; transition:opacity .7s ease; pointer-events:none; }
  .letter.ready.lit.inroom .spot { opacity:0; }
  .room:not(.ready) .back { opacity:0; pointer-events:none; }
  .tearclone { pointer-events:none; }
  @media (prefers-reduced-motion: reduce) { .room.lit .player, .room.lit .beam { animation:none; opacity:1; } }
  .player { position:relative; z-index:3; width:min(100%, calc(80vh * var(--ar, 1.7778))); aspect-ratio:var(--ar, 1.7778); margin:0 auto; background:#000 center/cover; border-radius:4px; overflow:hidden;
            box-shadow:0 24px 70px rgba(0,0,0,.7); transition:transform .65s cubic-bezier(.65,0,.25,1), box-shadow .65s ease; will-change:transform; }
  .player iframe { background:transparent; color-scheme:light; opacity:0; transition:opacity .5s ease; }
  .player iframe.on { opacity:1; }
  .room .rm > :not(.player) { transition:filter .6s ease, opacity .6s ease; }
  .room.theater .rm > :not(.player) { filter:blur(14px); opacity:.18; pointer-events:none; }
  .room.theater .back, .letter.watching .hang { opacity:.16; }                 /* while a film plays, the buttons step back */
  .room.theater .back:hover, .letter.watching .hang:hover { opacity:.9; }
  .room.theater { overflow:hidden; }
  .player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
  .facade { all:unset; cursor:pointer; position:absolute; inset:0; display:grid; place-items:center; align-content:center; gap:12px; color:#fbc4d8; background:rgba(0,0,0,.25); transition:background .3s ease; }
  .facade:hover, .facade:focus-visible { background:rgba(0,0,0,.05); }
  .facade i { width:76px; height:76px; border-radius:50%; border:1.5px solid #fbc4d8; display:grid; place-items:center; box-shadow:0 0 24px rgba(255,160,198,.35); }
  .facade i::after { content:""; margin-left:6px; border-style:solid; border-width:11px 0 11px 18px; border-color:transparent transparent transparent #fbc4d8; }
  .facade span { font-size:.72rem; letter-spacing:.28em; text-transform:uppercase; }
  .nolink { position:absolute; inset:0; display:grid; place-items:center; color:#8f8b84; font-size:.8rem; letter-spacing:.2em; text-transform:uppercase; text-align:center; padding:20px; }
  .parts { display:flex; gap:22px; margin-top:16px; }
  .parts button { all:unset; cursor:pointer; font-size:.74rem; letter-spacing:.22em; text-transform:uppercase; color:#8f8b84; padding-bottom:5px; border-bottom:1px solid transparent; }
  .parts button.on, .parts button:hover, .parts button:focus-visible { color:#fbc4d8; border-bottom-color:#fbc4d8; }
  .rmeta { margin:34px 0 10px; font-size:.74rem; letter-spacing:.24em; text-transform:uppercase; color:#fbc4d8; }
  .room h3 { margin:0 0 18px; font-family:var(--font-display); font-style:italic; font-weight:400; font-size:clamp(1.8rem,4.8vw,2.8rem); line-height:1.05; text-wrap:balance; }
  .rdesc { max-width:58ch; margin:0 0 30px; color:#cfcac1; font-size:1.02rem; }
  .credits { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:18px 28px; margin:0 0 40px; padding-top:22px; border-top:1px dashed #3a3633; }
  .credits dt { font-size:.68rem; letter-spacing:.22em; text-transform:uppercase; color:#8f8b84; margin:0 0 4px; }
  .credits dd { margin:0; font-size:.98rem; }
  .strip { position:relative; display:flex; gap:10px; overflow-x:auto; padding:30px 18px; background:#1a1817; border-radius:3px; }
  .strip::before, .strip::after { content:""; position:absolute; left:0; right:0; height:8px; background:repeating-linear-gradient(90deg, #0c0b0b 0 9px, transparent 9px 19px); background-position:6px 0; }
  .strip::before { top:11px; } .strip::after { bottom:11px; }
  .strip button { all:unset; cursor:pointer; flex:0 0 auto; }
  .strip img { display:block; height:clamp(96px,18vw,150px); width:auto; border-radius:2px; transition:transform .3s ease; }
  .strip button:hover img, .strip button:focus-visible img { transform:scale(1.04); }
  .stillcap { margin:0 0 12px; font-size:.68rem; letter-spacing:.22em; text-transform:uppercase; color:#8f8b84; }
  .back { all:unset; cursor:pointer; position:fixed; z-index:101; top:max(18px, env(safe-area-inset-top, 0px)); left:max(18px, env(safe-area-inset-left, 0px));
          font-size:.78rem; letter-spacing:.16em; text-transform:uppercase; color:#f1efe9; border:1px solid #f1efe9; border-radius:999px; padding:9px 18px; transition:opacity .5s ease, background .2s ease, color .2s ease; }
  .back:hover, .back:focus-visible { background:#f1efe9; color:#0c0b0b; }
  .letter.inroom .hang { color:#f1efe9; border-color:#f1efe9; }
  .letter.inroom .hang:hover, .letter.inroom .hang:focus-visible { background:#f1efe9; color:#0c0b0b; }
  .lb { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.92); display:grid; place-items:center; padding:24px; }
  .lb img { max-width:100%; max-height:100%; border-radius:3px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>

      <defs>

      energy += (Math.min(1, speed * .9) - energy) * Math.min(1, dt * 3.2);
      // each panel hangs from an anchor that travels to the side; the hem swings like a pendulum as the anchor speeds up and slows down
      const sg = stages(prog), pe = sg[0] * .3 + sg[1] * .7, pv = (pe - pePrev) / Math.max(dt, .001), pa = (pv - pvPrev) / Math.max(dt, .001); pePrev = pe; pvPrev = pv;
      { const st = stripRect(), tw = st.x1 - st.x0, trav = [W * .05 - (st.x0 + tw * .25), (W - W * .05) - (st.x1 - tw * .25)];
        for (let sd = 0; sd < 2; sd++) {
          const acc = clamp(trav[sd] * pa, -2200, 2200), a = -8 * swS[sd] - 1.6 * swV[sd] - .6 * acc;
          swV[sd] += a * dt; swS[sd] = clamp(swS[sd] + swV[sd] * dt, -120 * sc(), 120 * sc());
        }
        swing = Math.abs(swS[0]) + Math.abs(swS[1]) + (Math.abs(swV[0]) + Math.abs(swV[1])) * .2; }
      step(dt / 2); step(dt / 2);
      draw(now);
      const moving = (dir > 0 && prog < 1) || (dir < 0 && prog > 0) || energy > .004 || Math.abs(pleatTo - pleat) > .004 || phys > .06 || swing > .4 || grab;
      if (moving) requestAnimationFrame(frame); else running = false;
    }
    const kick = () => { if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); } };
    const live = () => prog >= .995 && dir > 0;
    function drapeAt(px, py) {                                                    // 0 = left curtain, 1 = right curtain, -1 = neither
      if (!live()) return -1; const kf = clamp(py / H * NY, 0, NY), k0 = Math.min(NY - 1, Math.floor(kf)), a = kf - k0, B = 10;
      const e0 = NSX[0][(P - 1) * R + k0] * (1 - a) + NSX[0][(P - 1) * R + k0 + 1] * a, e1 = NSX[1][(P - 1) * R + k0] * (1 - a) + NSX[1][(P - 1) * R + k0 + 1] * a;

    }

    return {
      start(r) { strip = r; swS = [0, 0]; swV = [0, 0]; pePrev = 0; pvPrev = 0; swing = 0; prog = 0; dir = 0; pleat = 0; pleatTo = 0; energy = 0; tPrev = 0; grab = null; phys = 0; DX.forEach(a => a.fill(0)); VX.forEach(a => a.fill(0)); draw(performance.now()); },
      reset() { swS = [0, 0]; swV = [0, 0]; pePrev = 0; pvPrev = 0; swing = 0; prog = 0; dir = 0; pleat = 0; pleatTo = 0; energy = 0; tPrev = 0; grab = null; phys = 0; DX.forEach(a => a.fill(0)); VX.forEach(a => a.fill(0)); draw(performance.now()); },
      pleatTo(v) { pleatTo = v; kick(); }, open(v) { if (v) measure(); dir = v ? 1 : -1; lagDir = dir; if (!v) grab = null; kick(); },
      drapeAt,
      brush(px, py, vx) {                                                          // a hand brushing through the fabric
        if (!live()) return; const R0 = 120 * sc(), imp = clamp(vx, -2200, 2200) * .05;

          const dx = NSX[side][c * R + k] - px, dy = NSY[k] - py, w = Math.exp(-(dx * dx + dy * dy) / (R0 * R0));
          if (w > .02) VX[side][c * R + k] = clamp(VX[side][c * R + k] + imp * w, -420, 420);

      grabStart(px, py) {

        for (let c = 1; c < P; c++) for (let k = 1; k < R; k++) { const dx = NSX[side][c * R + k] - px, dy = NSY[k] - py, d = dx * dx + dy * dy; if (d < best) { best = d; bc = c; bk = k; } }
        const i = bc * R + bk; grab = { side, c: bc, k: bk, rest: NSX[side][i] - DX[side][i], target: DX[side][i] }; kick(); return true;
      },
      grabMove(px) { if (grab) { const raw = px - grab.rest, mx = W * .38; grab.target = Math.sign(raw) * mx * (1 - Math.exp(-Math.abs(raw) / mx)); kick(); } },   // gets heavier the further you pull
      grabEnd() { grab = null; kick(); },
      maxDx() { let m = 0; DX.forEach(a => a.forEach(v => { m = Math.max(m, Math.abs(v)); })); return +m.toFixed(1); }
    };
  })();
  // brushing and pulling the curtains (mouse or finger)
  (function () {
    let lastT = 0, lastX = 0, grabbing = false, suppress = false;
    const ok = () => letterOpen && !roomOpen;
    const curDot = document.getElementById('cur');
    window.addEventListener('pointermove', e => {
      if (!ok() && !grabbing) { curDot.classList.remove('hand', 'grab', 'inlight'); return; }
      const now = performance.now(), vx = (e.clientX - lastX) / Math.max(.008, (now - lastT) / 1000); lastT = now; lastX = e.clientX;
      if (grabbing) { curDot.classList.remove('inlight'); curtainFx.grabMove(e.clientX); return; }
      const overBtn = e.target.closest && e.target.closest('button, a, input, [role="button"]');
      const onDrape = !overBtn && curtainFx.drapeAt(e.clientX, e.clientY) >= 0;
      curDot.classList.toggle('hand', onDrape);
      const onStub = overBtn && overBtn.classList.contains('stub');                // the tickets are lit by the spotlight, so no dot there either
      curDot.classList.toggle('inlight', e.pointerType === 'mouse' && (!overBtn || onStub) && !onDrape && letter.classList.contains('ready'));   // the pink dot only shows on the curtains and buttons
      if (e.pointerType === 'mouse' || e.buttons) curtainFx.brush(e.clientX, e.clientY, vx);
    }, { passive:true });
    window.addEventListener('pointerdown', e => {
      if (!ok() || (e.pointerType === 'mouse' && e.button !== 0)) return;
      if (e.target.closest && e.target.closest('button, a, input, [role="button"]')) return;      // the hang up button sits over the curtain: buttons always win
      if (curtainFx.grabStart(e.clientX, e.clientY)) { grabbing = true; suppress = true; lastX = e.clientX; curDot.classList.remove('hand'); curDot.classList.add('grab'); e.preventDefault(); e.stopPropagation(); }
    }, true);
    const end = () => { if (!grabbing) return; grabbing = false; curtainFx.grabEnd(); curDot.classList.remove('grab'); setTimeout(() => { suppress = false; }, 80); };
    window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
    window.addEventListener('click', e => { if (suppress) { e.stopPropagation(); e.preventDefault(); } }, true);
    window.__curtain = { fx: curtainFx };
  })();

  /* ---------- spotlight that follows the cursor and wraps whichever ticket you're on ---------- */
  (function () {
    const spot = document.getElementById('spot');
    if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
    // drawn small and scaled up by the browser: cheap to redraw every frame, and the edges come out naturally soft
    const SC = 1 / 5, sx = spot.getContext('2d');
    const fit = () => { spot.width = Math.ceil(innerWidth * SC); spot.height = Math.ceil(innerHeight * SC); };
    fit();
    let mx = innerWidth / 2, my = innerHeight * .3, hovered = null, running = false, cur = null, pinned = null;
    const target = () => {
      if (pinned && pinned.isConnected) { const r = pinned.getBoundingClientRect(), p = 4; return [r.left - p, r.top - p, r.width + 2 * p, r.height + 2 * p, 10, .9]; }
      if (hovered && hovered.isConnected && !hovered.closest('[hidden]')) { const r = hovered.getBoundingClientRect(), p = 10; return [r.left - p, r.top - p, r.width + 2 * p, r.height + 2 * p, 16, .74]; }
      const R = Math.max(80, Math.min(125, innerWidth * .085)); return [mx - R, my - R, 2 * R, 2 * R, R, .74];
    };
    const paint = () => {
      const w = spot.width, h = spot.height, [x, y, cw, ch, cr] = cur.slice(0, 5).map(v => v * SC);
      sx.globalCompositeOperation = 'source-over'; sx.shadowColor = 'transparent'; sx.clearRect(0, 0, w, h);
      sx.fillStyle = `rgba(5,4,4,${cur[5].toFixed(3)})`; sx.fillRect(0, 0, w, h);
      // cut a blurred hole: the shape is drawn far off-canvas and only its soft shadow lands here (works in every browser)
      const off = w + h + 200;
      sx.globalCompositeOperation = 'destination-out'; sx.shadowColor = '#000'; sx.shadowBlur = 6; sx.shadowOffsetX = off; sx.fillStyle = '#000';
      sx.beginPath(); const r = Math.min(cr, cw / 2, ch / 2), X = x - off;
      sx.moveTo(X + r, y); sx.arcTo(X + cw, y, X + cw, y + ch, r); sx.arcTo(X + cw, y + ch, X, y + ch, r); sx.arcTo(X, y + ch, X, y, r); sx.arcTo(X, y, X + cw, y, r); sx.closePath(); sx.fill();
    };
    function tick() {
      const t = target(), k = .2; let d = 0;
      for (let i = 0; i < 6; i++) { const dv = t[i] - cur[i]; cur[i] += dv * k; d = Math.max(d, Math.abs(dv) * (i === 5 ? 300 : 1)); }
      paint(); if (d > .25) requestAnimationFrame(tick); else running = false;
    }
    const go = () => { if (!cur) { cur = target(); paint(); } if (!running) { running = true; requestAnimationFrame(tick); } };
    window.addEventListener('pointermove', e => {
      if (e.pointerType !== 'mouse') return; mx = e.clientX; my = e.clientY;
      const el = document.elementFromPoint(mx, my); hovered = el && el.closest ? el.closest('.letter .stub') : null;
      if (!letter.classList.contains('lit')) { letter.classList.add('lit'); cur = null; }
      go();

    letter.addEventListener('scroll', go, { passive:true }); window.addEventListener('resize', () => { fit(); if (cur) paint(); go(); });
    spotPin = el => { pinned = el; if (cur) go(); };
  })();

  async function openTicket(entry) {
    frame.classList.toggle('narrow', narrow());
    document.getElementById('tk-title').textContent = entry.title;
    document.getElementById('tk-no').textContent = 'No. ' + entry.num;
    document.getElementById('tk-ser').textContent = '00' + entry.num + ' · ' + new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'2-digit' }).replace('/', '');
    document.getElementById('lmeta').textContent = 'No. ' + entry.num + ' · ' + stamp();
    document.getElementById('ltitle').textContent = entry.title;
    document.getElementById('ltext').textContent = entry.blurb;
    document.getElementById('tkrail').textContent = Array(40).fill('Admit one · Mea Amélie ·').join(' ');
    const isWorks = entry.num === '135';
    worksEl.hidden = !isWorks; lsoon.hidden = isWorks; if (isWorks) buildWorks();
    letter.classList.remove('ready');
    if (narrow()) { camMode = 'full'; setCam('full'); await wait(reduce ? 0 : 800); }
    savedY = window.scrollY;
    tk.hidden = false; tkp.style.transition = 'none'; setH(100); void tkp.offsetWidth;
    { const tb = document.getElementById('tk-title'); let fs = 24; tb.style.fontSize = fs + 'cqw';       // shrink the name until its longest word fits the ticket
      while (fs > 9 && tb.scrollWidth > tb.clientWidth + 1) { fs -= .5; tb.style.fontSize = fs + 'cqw'; } }
    const h0 = Math.ceil(tkc.offsetHeight); tkH0 = h0; tkHF = Math.round(innerHeight * 1.5); setH(h0); document.getElementById('tkrail').style.setProperty('--rt', h0 + 'px');
    rollH0 = h0; rollHF = Math.round(innerHeight * 1.7);
    tkp.style.transform = `translateY(${-h0}px)`;
    { const slotAbs = frame.getBoundingClientRect().top + window.scrollY + frame.clientHeight * .716,                     // if the printed ticket wouldn't fit on screen,
            need = slotAbs + h0 + 40 - (window.scrollY + innerHeight);                                                       // settle the view down to the slot first,
      if (need > 0) await glide(window.scrollY, window.scrollY + need, 650); }                                            // then it holds still while the ticket prints
    rollBase = window.scrollY;
    printSound(20); await roll(true);                                            // prints out slowly, then rolls faster and faster until the end runs off the bottom
    const tr = tkp.getBoundingClientRect();                                      // the ticket strip hands over to the curtain, in exactly the same place
    curtainFx.start({ x0: tr.left, x1: tr.right, y1: innerHeight });
    letter.classList.remove('dark', 'ready'); letter.hidden = false; tk.style.visibility = 'hidden'; document.body.style.overflow = 'hidden';
    letter.classList.add('dark'); curtainFx.pleatTo(1); curtainFx.open(true);
    await wait(reduce ? 0 : 1000); letter.classList.add('ready'); letterOpen = true; syncCur();      // hang up works the moment it appears
    try { hang.focus({ preventScroll:true }); } catch (e) {}
  }
  async function hangUp() {
    if (!letterOpen) return; letterOpen = false; syncCur(); closeRoom(true); document.getElementById('cur').classList.remove('hand', 'grab', 'inlight');
    letter.classList.remove('ready'); await wait(350);
    curtainFx.open(false); await wait(reduce ? 0 : 1650);
    letter.classList.remove('dark'); curtainFx.pleatTo(0); await wait(reduce ? 0 : 350);
    tk.style.visibility = ''; letter.hidden = true; document.body.style.overflow = '';
    await roll(false);                                                           // rolls back up fast, slows down, then slides slowly into the slot
    if (Math.abs(window.scrollY - savedY) > 1) await glide(window.scrollY, savedY, 650);

  }
  hang.addEventListener('click', hangUp);
  window.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (!lb.hidden) lb.hidden = true; else if (theater) exitTheater(); else if (roomOpen) closeRoom(); else hangUp(); });
  async function callSequence() {
    const id = ++runId, alive = () => id === runId;
    const key = digits.join(''); current = DIRECTORY[key] ? Object.assign({ num:key }, DIRECTORY[key]) : null;
    if (current) { wrongs = 0; dirEl.classList.remove('nudge'); }
    else {
      wrongs++;

  }

  }
  document.getElementById('again').addEventListener('click', resetPhone);

  /* ---------- on arrival: Mea picks up ---------- */
  (async function greet() {
    const id = runId, alive = () => id === runId && phase === 'dial' && !digits.length;
    await wait(900); if (!alive()) return;
    lcdShow([ANSWER1]); live.textContent = ANSWER1; await wait(1900); if (!alive()) return;
    lcdShow(ANSWER2); live.textContent = ANSWER1 + ', ' + ANSWER2.join(' '); await wait(3200); if (!alive()) return;

  /* ---------- dragging the wheel ---------- */
  let rot = 0, drag = null, returning = null;      // rot = degrees turned clockwise
  function toArt(e) {
    const r = svg.getBoundingClientRect();
    return { x:(e.clientX - r.left) * 1500 / r.width, y:(e.clientY - r.top) * 2000 / r.height };
  }
  const angleAt = p => Math.atan2(-(p.y - CY), p.x - CX) * 180 / Math.PI;
  function pickHole(p) {
    let best = null, bd = 1e9;
    digitsList.forEach(n => { const d = Math.hypot(p.x - (CX + hx(n)), p.y - (CY - hy(n))); if (d < HOLE_R * 1.5 && d < bd) { bd = d; best = n; } });
    return best;
  }
  hit.addEventListener('pointerdown', e => {
    if (phase === 'busy') { runId++; finishNow(); return; }       // tap during the call = skip to the end
    if (returning || phase !== 'dial') return;

  });
  hit.addEventListener('pointermove', e => {
    const p = toArt(e);
    if (!drag) { hit.style.cursor = (!returning && phase === 'dial' && pickHole(p) !== null) ? 'grab' : 'none'; return; }
    const a = angleAt(p); let d = drag.last - a;
    if (d > 180) d -= 360; if (d < -180) d += 360;
    const before = Math.floor(rot / 30);
    rot = Math.max(0, Math.min(drag.max, rot + d));
    if (Math.floor(rot / 30) !== before) tick();
    drag.last = a;
  });
  function release() { if (!drag) return; hit.style.cursor = 'none'; returning = { n:drag.n, ok:rot >= drag.max - 5 }; drag = null; }
  hit.addEventListener('pointerup', release); hit.addEventListener('pointercancel', release);
  window.addEventListener('keydown', e => {
    if (!/^[0-9]$/.test(e.key) || drag || returning || phase !== 'dial') return;
    const n = +e.key; rot = maxRot(n); returning = { n, ok:true }; tick();
  });

  /* test hook: where things are on screen */
  window.__ph = {
    busy: () => !!returning, count: () => digits.length, phase: () => phase, isOpen: () => letterOpen, hangUp: () => hangUp(), lines: () => lastLines.join(' / '),
    hole(n) { const r = svg.getBoundingClientRect(), s = r.width / 1500; return [r.left + (CX + hx(n)) * s, r.top + (CY - hy(n)) * s, holeAngle(n), maxRot(n)]; },
    center() { const r = svg.getBoundingClientRect(), s = r.width / 1500; return [r.left + CX * s, r.top + CY * s]; },
    ringPx() { return svg.getBoundingClientRect().width / 1500 * RING; }
  };

  /* ---------- the pink dot cursor ---------- */
  (function () {
    if (!window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
    const cur = document.getElementById('cur'); let x = -50, y = -50, tx = -50, ty = -50, seen = false, onHand = false;
    // over an embedded video the page can't see the mouse at all, so the dot steps aside there (vimeo's own cursor works its controls),
    // and comes back exactly under the mouse when it leaves, instead of sliding over from where it froze
    let away = false;
    const goAway = () => { away = true; cur.style.opacity = 0; };

    window.addEventListener('blur', goAway);
    window.addEventListener('pointermove', e => {
      if (e.pointerType === 'touch') return;
      if (e.target && e.target.tagName === 'IFRAME') { goAway(); return; }
      tx = e.clientX; ty = e.clientY; if (!seen || away) { x = tx; y = ty; seen = true; away = false; }
      onHand = e.target === hit && /grab/.test(hit.style.cursor);                // over a finger hole: an empty ring instead of a hand
      cur.classList.toggle('ring', onHand); cur.style.opacity = 1;
    }, { passive:true });
    document.addEventListener('pointerleave', () => { cur.style.opacity = 0; });
    document.documentElement.addEventListener('mouseleave', () => { cur.style.opacity = 0; });
    window.addEventListener('pointerdown', () => cur.classList.add('down'));
    window.addEventListener('pointerup', () => cur.classList.remove('down'));
    (function move() {
      const k = reduce ? 1 : .35; x += (tx - x) * k; y += (ty - y) * k;
      cur.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
      requestAnimationFrame(move);
    })();
  })();

  /* ---------- loop ---------- */
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.5, (now - last) / 1000); last = now;
    if (returning) {
      const before = Math.floor(rot / 30);
      rot -= 300 * dt;
      if (Math.floor(rot / 30) !== before) tick();
      if (rot <= 0) { rot = 0; const r = returning; returning = null; if (r.ok) onDigit(r.n); }
    }
    wheel.setAttribute('transform', `rotate(${rot.toFixed(2)} ${CX} ${CY})`);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
